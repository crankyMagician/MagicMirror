# Which way the picture faces when the kiosk starts. Copied once to
# /etc/magicmirror-kiosk/output.conf.
#
# The settings page has the same choice on its Mirror tab, and a direction
# saved there is applied on top of this file. Edit the copy on the Pi only
# when the page is out of reach, then run: sudo systemctl restart magicmirror-kiosk
#
#   transform 90      portrait, picture turned clockwise ("Tall")
#   transform 270     portrait, picture turned counter-clockwise ("Tall, turned around")
#   transform normal  landscape ("Wide")
#   transform 180     landscape, upside down ("Wide, turned around")
output * transform 270
