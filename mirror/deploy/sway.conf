# Template. setup-pi.sh fills in @MM_DIR@ and @ETC_DIR@ and installs the result
# as /etc/magicmirror-kiosk/sway.conf.

# Rotation lives in its own file so it can change on the Pi without a deploy.
include @ETC_DIR@/output.conf

# No window borders, and the pointer hides after one second without movement.
default_border none
default_floating_border none
seat * hide_cursor 1000

# Every window fills the screen.
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable

exec @MM_DIR@/mirror/deploy/kiosk-session.sh
